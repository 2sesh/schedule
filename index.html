<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Графік прийому у період тимчасової відсутності лікаря</title>
<style>
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF;
    --card-a:#FFFFFF; --card-b:#F7F7FA; --card-border:#E1E1E6; --card-border-strong:#C7C7CC;
    --ink:#1D1D1F; --ink-secondary:#55555A; --separator:#E3E3E8;
    --fill:rgba(120,120,128,0.14);
    --accent:#007AFF; --accent-soft:rgba(0,122,255,0.08); --success:#248A3D; --danger:#D70015; --on-accent:#FFFFFF;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); line-height:1.45; -webkit-font-smoothing:antialiased; overflow-x:hidden; -webkit-tap-highlight-color:transparent;}
  a{color:inherit;} button{font:inherit;}

  .page{max-width:600px; margin:0 auto; padding:52px 20px 64px;}

  .header-card{background:var(--accent); border-radius:18px; padding:22px 22px 20px; margin-bottom:22px; overflow:hidden;}
  .header-logo{float:right; width:68px; height:68px; margin:2px 0 10px 14px;}
  .header-logo svg{display:block; width:100%; height:100%;}
  .title{margin:0; font-weight:600; font-size:clamp(1.1rem, 0.95rem + 0.8vw, 1.4rem); line-height:1.3; letter-spacing:-0.01em; color:#fff;}
  .subtitle{margin:6px 0 0; font-size:0.78rem; color:rgba(255,255,255,0.88); line-height:1.4; font-weight:500;}

  .meta-row{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap;}
  .meta-today{display:inline-flex; align-items:center; gap:6px; font-size:0.9rem; color:var(--ink-secondary);}
  .today-icon{width:15px; height:15px; color:var(--accent); flex-shrink:0;}
  .today-weekday{color:var(--ink); font-weight:700;}
  .sync-wrap{display:flex; align-items:center; gap:8px;}
  .sync-badge{display:inline-flex; align-items:center; gap:7px; font-size:0.83rem; color:var(--ink-secondary); white-space:nowrap;}
  .sync-dot{width:7px; height:7px; border-radius:50%; background:var(--ink-secondary); flex-shrink:0;}
  .sync-dot.ok{background:var(--success);}
  .sync-dot.err{background:var(--danger);}
  .sync-dot.loading{background:var(--accent); animation:pulseDot 1.1s ease-in-out infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;} 50%{opacity:0.3;}}
  .refresh-btn{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border:none; background:var(--fill); color:var(--accent); border-radius:10px; cursor:pointer; padding:0; flex-shrink:0; -webkit-tap-highlight-color:transparent;}
  .refresh-btn:active{opacity:0.6;}
  .refresh-btn.spinning .refresh-icon{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .refresh-icon{width:16px; height:16px;}

  .segmented{position:relative; display:flex; flex-wrap:wrap; gap:3px; background:var(--fill); border-radius:10px; padding:3px; margin:22px 0;}
  .segmented.hidden{display:none;}
  .segmented-thumb{position:absolute; background:var(--accent); border-radius:8px; box-shadow:0 2px 8px rgba(0,122,255,0.35); transition:left .28s cubic-bezier(.4,0,.2,1), top .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1);}
  .segment{flex:0 0 auto; position:relative; z-index:1; background:none; border:none; padding:9px 14px; font-size:0.85rem; line-height:1.25; font-weight:500; color:var(--ink-secondary); cursor:pointer; border-radius:8px; text-align:center; white-space:nowrap; -webkit-tap-highlight-color:transparent; transition:color .18s ease;}
  .segment.active{color:var(--on-accent); font-weight:600;}
  .segment:active{opacity:0.55;}
  .segment:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .cards{display:flex; flex-direction:column; gap:14px;}
  .card{border:1px solid var(--card-border); border-radius:16px; padding:18px; box-shadow:0 1px 2px rgba(0,0,0,0.05), 0 6px 16px rgba(0,0,0,0.06);}
  .card:nth-child(odd){background:var(--card-a); border-color:var(--card-border-strong);}
  .card:nth-child(even){background:var(--card-b); border-color:#EDEDF1;}

  .card-status{display:flex; align-items:center; gap:6px; margin:0 0 6px; font-size:0.86rem; font-weight:500; color:var(--ink-secondary);}
  .status-dot{width:7px; height:7px; border-radius:50%; background:var(--ink-secondary); flex-shrink:0;}
  .status-dot.active{background:var(--success); animation:pulseSoft 2.4s ease-in-out infinite;}
  @keyframes pulseSoft{0%,100%{opacity:1;} 50%{opacity:0.45;}}
  .card-status.is-active{color:var(--success);}

  .doctor-head{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .doctor-head-text{min-width:0;}
  .doctor-avatar{position:relative; width:52px; height:52px; border-radius:50%; overflow:hidden; background:var(--accent-soft); flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .doctor-avatar-initials{font-size:1rem; font-weight:700; color:var(--accent); line-height:1;}
  .doctor-avatar img{position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%; object-fit:cover;}
  .card-name{margin:0 0 2px; font-size:1.15rem; font-weight:700; color:var(--ink);}
  .card-role{margin:0; font-size:0.9rem; color:var(--ink-secondary);}
  .card-ambulatory{display:flex; align-items:center; gap:5px; margin:0 0 10px; font-size:0.85rem; color:var(--ink-secondary);}
  .ambulatory-icon{width:12px; height:12px; flex-shrink:0; opacity:0.85;}
  .card-period{margin:0 0 14px; font-size:0.92rem; color:var(--ink);}

  .progress-track{height:5px; border-radius:999px; background:var(--fill); margin-bottom:6px; overflow:hidden;}
  .progress-fill{height:100%; border-radius:999px; background:var(--accent);}
  .progress-labels{display:flex; justify-content:space-between; font-size:0.74rem; color:var(--ink-secondary); margin-bottom:16px;}

  .covers{background:var(--accent-soft); border-radius:12px; padding:14px 16px;}
  .covers-label{display:inline-block; margin:0 0 8px; font-size:0.65rem; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; color:var(--accent); background:var(--surface); border:1px solid var(--accent); border-radius:999px; padding:2px 9px;}
  .covers-head{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .covers-head-text{min-width:0;}
  .covers-name{margin:0 0 2px; font-size:1.05rem; font-weight:700; color:var(--accent);}
  .covers-role{margin:0; font-size:0.87rem; color:var(--ink-secondary);}

  .room-badge{display:inline-flex; align-items:center; gap:5px; background:var(--accent); color:#fff; font-weight:700; font-size:0.82rem; padding:6px 11px; border-radius:999px; white-space:nowrap; margin-bottom:12px;}
  .room-icon{width:13px; height:13px;}

  .cta-button{display:block; text-align:center; padding:12px 16px; border-radius:12px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; font-size:0.95rem;}
  .cta-button:active{opacity:0.7;}
  .cta-button:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}

  .contact-group-label{margin:14px 0 6px; font-size:0.78rem; font-weight:600; color:var(--accent);}
  .contact-phone{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 14px; margin:0 0 8px; border-radius:10px; background:var(--fill); text-decoration:none; -webkit-tap-highlight-color:transparent;}
  .contact-phone:last-child{margin-bottom:0;}
  .contact-phone:active{opacity:0.6;}
  .contact-phone:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .contact-phone-text{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .contact-phone-label{font-size:0.86rem; color:var(--ink); font-weight:600;}
  .contact-phone-note{font-size:0.76rem; color:var(--ink-secondary); font-weight:500;}
  .contact-phone-number{font-size:0.92rem; font-weight:700; color:var(--accent); white-space:nowrap;}

  .empty-state{margin:0; padding:32px 4px; text-align:center; color:var(--ink-secondary); font-size:0.95rem; line-height:1.6;}

  @media (max-width:420px){ .page{padding:40px 16px 48px;} }
  @media (min-width:760px){
    .page{max-width:920px;}
    .cards{display:grid; grid-template-columns:repeat(2, 1fr); align-items:start;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
</style>
</head>

  function todayMidnight(){ const t=new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function diffDays(a,b){ return Math.round((a-b)/86400000); }
  function daysWord(n){
    const mod10=n%10, mod100=n%100;
    if(mod100>=11 && mod100<=14) return 'днів';
    if(mod10===1) return 'день';
    if(mod10>=2 && mod10<=4) return 'дні';
    return 'днів';
  }
  function fmtDay(d){ return new Intl.DateTimeFormat('uk-UA',{day:'numeric',month:'long'}).format(d); }
  function fmtDayYear(d){ return new Intl.DateTimeFormat('uk-UA',{day:'numeric',month:'long',year:'numeric'}).format(d); }
  function fmtToday(d){ return new Intl.DateTimeFormat('uk-UA',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d); }
  function fmtWeekday(d){ return new Intl.DateTimeFormat('uk-UA',{weekday:'long'}).format(d); }
  function fmtTodayDate(d){ return new Intl.DateTimeFormat('uk-UA',{day:'numeric',month:'long',year:'numeric'}).format(d); }
  function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

  function shortStatus(entry,start,end,now){
    const typeLabel = entry.absenceType==='vacation' ? 'У відпустці' : 'На лікарняному';
    const typeLabelFuture = entry.absenceType==='vacation' ? 'У відпустку' : 'На лікарняний';
    if(now < start){
      const d = diffDays(start, now);
      return {active:false, text:typeLabelFuture+' через '+d+' '+daysWord(d)};
    }
    if(!end){
      return {active:true, text:typeLabel+' · дата повернення уточнюється'};
    }
    if (now <= end){
      const left = diffDays(end, now);
      const tail = left===0 ? 'останній день' : 'ще '+left+' '+daysWord(left);
      return {active:true, text:typeLabel+' · '+tail};
    }
    return {active:false, text:'Завершено'};
  }

  function periodSentence(start,end){
    if(!end){
      return 'З '+fmtDayYear(start)+' · дата повернення уточнюється';
    }
    return 'З '+fmtDay(start)+' по '+fmtDayYear(end);
  }

  // ---- Live data: Google Visualization API (gviz) JSONP endpoint ----
  // Loaded as a <script> tag rather than fetch(), which is what lets this
  // reach docs.google.com directly from client-side JS without a CORS proxy.
  function loadSheet(sheetId, gid){
    return new Promise(function(resolve, reject){
      const cb = 'gvizCb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
      const timeout = setTimeout(function(){ cleanup(); reject(new Error('timeout')); }, 15000);
      function cleanup(){
        clearTimeout(timeout);
        delete window[cb];
        if(script.parentNode) script.parentNode.removeChild(script);
      }
      window[cb] = function(resp){ cleanup(); resolve(resp); };
      const script = document.createElement('script');
      script.src = 'https://docs.google.com/spreadsheets/d/'+sheetId+'/gviz/tq?tqx=out:json;responseHandler:'+cb+'&gid='+gid+'&_='+Date.now();
      script.onerror = function(){ cleanup(); reject(new Error('network')); };
      document.body.appendChild(script);
    });
  }

  function cellVal(row, i){ const c = row.c[i]; return c ? c.v : null; }

  const UA_MONTHS = {
    'січня':0,'лютого':1,'березня':2,'квітня':3,'травня':4,'червня':5,
    'липня':6,'серпня':7,'вересня':8,'жовтня':9,'листопада':10,'грудня':11
  };

  function parseFlexibleDate(v){
    if(v===null||v===undefined) return null;
    const s = String(v).trim();
    let m = s.match(/Date\((\d+),(\d+),(\d+)/);
    if(m) return new Date(+m[1], +m[2], +m[3]);
    m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    if(m) return new Date(+m[3], +m[2]-1, +m[1]);
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(m) return new Date(+m[3], +m[2]-1, +m[1]);
    m = s.toLowerCase().match(/^(\d{1,2})\s+([а-яіїєґ]+)\s+(\d{4})/);
    if(m && UA_MONTHS.hasOwnProperty(m[2])) return new Date(+m[3], UA_MONTHS[m[2]], +m[1]);
    return null;
  }

  function inferGender(fullName){
    const parts = (fullName||'').trim().split(/\s+/);
    const p = parts[parts.length-1] || '';
    if(/(ович|йович|ич)$/i.test(p)) return 'm';
    if(/(івна|ївна)$/i.test(p)) return 'f';
    return 'f';
  }

  function initialsOf(fullName){
    const parts = (fullName||'').trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return '';
    const a = parts[0].charAt(0);
    const b = parts.length > 1 ? parts[1].charAt(0) : '';
    return (a+b).toUpperCase();
  }

  function buildAvatarHtml(name, photoUrl, extraClass){
    const cls = 'doctor-avatar' + (extraClass ? ' '+extraClass : '');
    return '<div class="'+cls+'">'+
        '<span class="doctor-avatar-initials">'+initialsOf(name)+'</span>'+
        (/^https?:\/\//i.test(photoUrl||'') ? '<img src="'+photoUrl+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '')+
      '</div>';
  }

  function absenceTypeFrom(v){
    const s = (v||'').toString().trim().toLowerCase();
    return s.startsWith('лікарня') ? 'sick' : 'vacation';
  }

  // Схоже, прибрали ОБИДВІ колонки "Посада" (і лікаря, і дублера) — Кабінет тепер на G, а не на H.
  // Columns (після видалення обох "Посада" — увесь наступний перелік зсунувся на 2 вліво):
  // A Клініка · B Лікар · C Відпустка/лікарняний ·
  // D Період з · E по (можна лишити порожнім, якщо дата ще не відома — і для відпустки, і для лікарняного) ·
  // F Дублер · G Кабінет · H Записатись · K Амбулаторія
  // (I і J вільні; посада — і лікаря, і дублера — завжди тільки з DOCTOR_PROFILES, бо обидва
  //  відповідні стовпці видалено з таблиці)
  function parseTable(table){
    const entries = [];
    for(const r of table.rows){
      if(!r.c || !r.c[1] || !r.c[1].v) continue;
      const clinic = (cellVal(r,0)||'').toString().trim();
      const doctor = (cellVal(r,1)||'').toString().trim();
      const role = profileOf(doctor).role || '';
      const absenceType = absenceTypeFrom(cellVal(r,2));
      const start = parseFlexibleDate(cellVal(r,3));
      const end = parseFlexibleDate(cellVal(r,4));
      const substitute = (cellVal(r,5)||'').toString().trim();
      const substituteRole = profileOf(substitute).role || '';
      const room = (cellVal(r,6)||'').toString().trim();
      const bookingUrl = profileOf(substitute).substituteBookingUrl || (cellVal(r,7)||'').toString().trim();
      const ambulatory = (cellVal(r,10)||'').toString().trim();
      const photoUrl = profileOf(doctor).photo || '';
      const substitutePhotoUrl = profileOf(substitute).photo || '';
      if(!clinic || !start) continue; // дата "по" необов'язкова — для відпустки й лікарняного однаково
      entries.push({clinic:clinic, doctor:doctor, role:role, gender:inferGender(doctor), absenceType:absenceType, start:start, end:end, substitute:substitute, substituteRole:substituteRole, room:room, bookingUrl:bookingUrl, ambulatory:ambulatory, photoUrl:photoUrl, substitutePhotoUrl:substitutePhotoUrl});
    }
    return entries;
  }

  function setSyncState(status, msg){
    const dot = document.getElementById('syncDot');
    const text = document.getElementById('syncText');
    const btn = document.getElementById('refreshBtn');
    if(status === 'loading'){
      dot.className = 'sync-dot loading';
      text.textContent = 'синхронізація…';
      btn.classList.add('spinning');
    } else if(status === 'ok'){
      dot.className = 'sync-dot ok';
      text.textContent = 'оновлено о ' + new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
      btn.classList.remove('spinning');
    } else {
      dot.className = 'sync-dot err';
      text.textContent = 'помилка синхронізації';
      btn.classList.remove('spinning');
      document.getElementById('cards').innerHTML =
        '<p class="empty-state">Не вдалося завантажити дані з таблиці.<br>Перевірте, що доступ відкритий для «всіх, хто має посилання» (роль — перегляд), і натисніть кнопку оновлення вгорі.'+
        (msg ? '<br><span style="font-size:0.8rem;opacity:0.7;">'+msg+'</span>' : '')+'</p>';
    }
  }

  function positionThumb(){
    const container = document.getElementById('segmented');
    const thumb = document.getElementById('segThumb');
    const activeBtn = container.querySelector('.segment.active');
    if(!activeBtn || !thumb) return;
    const cRect = container.getBoundingClientRect();
    const bRect = activeBtn.getBoundingClientRect();
    thumb.style.left = (bRect.left - cRect.left) + 'px';
    thumb.style.top = (bRect.top - cRect.top) + 'px';
    thumb.style.width = bRect.width + 'px';
    thumb.style.height = bRect.height + 'px';
  }

  function renderTabs(){
    const container = document.getElementById('segmented');
    const tabs = state.clinics.concat([CONTACTS_TAB]);
    container.classList.remove('hidden');
    container.innerHTML = '<div class="segmented-thumb" id="segThumb"></div>';
    tabs.forEach(function(tab){
      const btn = document.createElement('button');
      btn.className = 'segment' + (tab===state.activeClinic ? ' active' : '');
      btn.textContent = tab;
      btn.setAttribute('role','tab');
      btn.setAttribute('aria-selected', tab===state.activeClinic ? 'true':'false');
      btn.addEventListener('click', function(){
        state.activeClinic = tab;
        container.querySelectorAll('.segment').forEach(function(b){
          const isActive = b===btn;
          b.classList.toggle('active', isActive);
          b.setAttribute('aria-selected', isActive ? 'true':'false');
        });
        positionThumb();
        renderEntries();
      });
      container.appendChild(btn);
    });
    requestAnimationFrame(positionThumb);
  }

  function renderEntries(){
    const container = document.getElementById('cards');
    container.innerHTML = '';

    if(state.activeClinic === CONTACTS_TAB){
      renderContacts(container);
      return;
    }

    if(!state.activeClinic){
      container.innerHTML = '<p class="empty-state">У таблиці поки немає жодного запису.</p>';
      return;

    const list = state.entries.filter(function(e){ return e.clinic === state.activeClinic; });
    if(list.length === 0){
      container.innerHTML = '<p class="empty-state">Наразі немає ні відпусток, ні лікарняних.</p>';
      return;
    }
    const now = todayMidnight();
    function statusRank(e){
      if(now >= e.start && (!e.end || now <= e.end)) return 0; // вже у відпустці/на лікарняному (включно з ще невідомою датою виходу)
      if(now < e.start) return 1; // ще має піти
      return 2; // вже завершилось
    }
    // завершені записи (відома дата "по", яка вже минула) не показуємо взагалі;
    // якщо дата "по" невідома — вважати завершеним не можна, тож такий запис лишається видимим
    const visible = list.filter(function(e){ return statusRank(e) !== 2; });
    if(visible.length === 0){
      container.innerHTML = '<p class="empty-state">Наразі немає ні відпусток, ні лікарняних.</p>';
      return;
    }
    visible.sort(function(a,b){
      const ra = statusRank(a), rb = statusRank(b);
      if(ra !== rb) return ra - rb;
      if(ra === 0){
        if(!a.end && !b.end) return 0;
        if(!a.end) return 1; // невідома дата виходу — показуємо після тих, чия дата вже відома
        if(!b.end) return -1;
        return a.end - b.end;
      }
      return a.start - b.start; // ra === rb === 1 (ще не почалось)
    });

    visible.forEach(function(entry){
      const start = entry.start, end = entry.end;
      const st = shortStatus(entry,start,end,now);
      const isActive = now>=start && (!end || now<=end);

      let progressHtml = '';
      if(isActive && end){
        const totalSpan = Math.max(1, diffDays(end,start));
        const pct = Math.min(100, Math.max(0, (diffDays(now,start)/totalSpan)*100));
        progressHtml =
          '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
          '<div class="progress-labels"><span>'+fmtDay(start)+'</span><span>'+fmtDayYear(end)+'</span></div>';
      }

      const roomBadge = entry.room
        ? '<span class="room-badge"><svg class="room-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4-4-7-7.5-7-11a7 7 0 0 1 14 0c0 3.5-3 7-7 11z"/><circle cx="12" cy="10" r="2.3"/></svg>Кабінет '+entry.room+'</span>'
        : '';

      const ambulatoryHtml = entry.ambulatory
        ? '<p class="card-ambulatory"><svg class="ambulatory-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4-4-7-7.5-7-11a7 7 0 0 1 14 0c0 3.5-3 7-7 11z"/><circle cx="12" cy="10" r="2.3"/></svg>'+entry.ambulatory+'</p>'
        : '';

      const avatarHtml = buildAvatarHtml(entry.doctor, entry.photoUrl);
      const substituteAvatarHtml = buildAvatarHtml(entry.substitute, entry.substitutePhotoUrl);

      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML =
        '<p class="card-status'+(isActive?' is-active':'')+'"><span class="status-dot'+(isActive?' active':'')+'"></span>'+st.text+'</p>'+
        '<div class="doctor-head">'+
          avatarHtml+
          '<div class="doctor-head-text">'+
            '<h2 class="card-name">'+entry.doctor+'</h2>'+
            '<p class="card-role">'+entry.role+'</p>'+
          '</div>'+
        '</div>'+
        ambulatoryHtml+
        '<p class="card-period">'+periodSentence(start,end)+'</p>'+
        progressHtml+
        '<div class="covers">'+
          '<p class="covers-label">Дублер</p>'+
          '<div class="covers-head">'+
            substituteAvatarHtml+
            '<div class="covers-head-text">'+
              '<p class="covers-name">'+entry.substitute+'</p>'+
              '<p class="covers-role">'+entry.substituteRole+'</p>'+
            '</div>'+
          '</div>'+
          roomBadge+
          (entry.bookingUrl ? '<a class="cta-button" href="'+entry.bookingUrl+'" target="_blank" rel="noopener noreferrer">Записатися на прийом</a>' : '')+
        '</div>';

      container.appendChild(card);
    });
  }

  function ensureActiveTab(){
    const valid = state.clinics.concat([CONTACTS_TAB]);
    if(!state.activeClinic || valid.indexOf(state.activeClinic) === -1){
      state.activeClinic = state.clinics[0] || CONTACTS_TAB;
    }
  }

  async function fetchData(){
    setSyncState('loading');
    try{
      const resp = await loadSheet(SHEET_ID, GID);
      if(resp.status === 'error'){
        throw new Error(resp.errors ? resp.errors.map(function(e){return e.detailed_message;}).join(', ') : 'gviz error');
      }
      const entries = parseTable(resp.table);
      state.entries = entries;
      const seen = [];
      entries.forEach(function(e){ if(seen.indexOf(e.clinic)===-1) seen.push(e.clinic); });
      seen.sort(function(a,b){ return clinicRank(a) - clinicRank(b); });
      state.clinics = seen;
      ensureActiveTab();
      renderTabs();
      renderEntries();
      setSyncState('ok');
    }catch(err){
      console.error(err);
      ensureActiveTab();
      setSyncState('error', err.message);
      renderTabs();
      if(state.activeClinic === CONTACTS_TAB){ renderEntries(); }
    }
  }

  document.getElementById('refreshBtn').addEventListener('click', fetchData);
  let resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(positionThumb, 150);
  });

  document.getElementById('todayLine').innerHTML =
    '<svg class="today-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'+
    '<span class="today-weekday">'+capitalize(fmtWeekday(new Date()))+'</span>, '+fmtTodayDate(new Date());
  fetchData();
  setInterval(fetchData, REFRESH_MS);
})();
</script>
</body>
</html>
